<body class="min-h-full flex flex-col bg-[#f5f5f5]">
<div id="app" class="flex h-screen overflow-hidden">
<!-- Sidebar -->
<aside class="w-[180px] shrink-0 bg-white border-r border-[#e0e0e0] flex flex-col">
<div class="px-4 py-4 border-b border-[#e0e0e0]"><div class="flex items-center gap-2">
<svg class="w-6 h-6 text-[#1a6fc9]" fill="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1" opacity="0.6"/><rect x="3" y="13" width="8" height="8" rx="1" opacity="0.6"/><rect x="13" y="13" width="8" height="8" rx="1" opacity="0.3"/></svg>
<span class="text-base font-bold text-gray-800">Mill-Box</span></div></div>
<nav class="flex-1 py-2">
<a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-[#1a6fc9] bg-[#e8f0fe] font-medium border-l-3 border-[#1a6fc9]"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>生コン書類</a>
<a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-gray-600 hover:bg-gray-50">帳票</a>
<a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-gray-600 hover:bg-gray-50">利用料</a>
<a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-gray-600 hover:bg-gray-50">ユーザー</a>
<a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-gray-600 hover:bg-gray-50">admin</a>
</nav>
<div class="border-t border-[#e0e0e0] px-4 py-3"><div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-full bg-gray-300 flex items-center justify-center text-[11px] text-white font-bold">U</div>
<div class="overflow-hidden"><p class="text-[12px] text-gray-700 truncate">user@example.com</p><p class="text-[11px] text-gray-400">demo</p></div></div></div>
</aside>

<!-- Main -->
<div class="flex-1 flex flex-col overflow-hidden">
<header class="bg-white border-b border-[#e0e0e0] px-6 py-3 flex items-center justify-between shrink-0">
<h1 class="text-base font-bold text-gray-800">生コン書類一括アップロード</h1>
<div class="flex items-center gap-2">
<button onclick="document.getElementById('file-input').click()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 border border-[#1a6fc9] text-[#1a6fc9] rounded text-[13px] font-medium hover:bg-blue-50 transition-colors">+ PDFアップロード</button>
<button id="btn-lot" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 border border-[#e0e0e0] text-gray-600 rounded text-[13px] font-medium disabled:opacity-40 disabled:cursor-not-allowed" disabled>ロット仕分け</button>
</div></header>

<!-- Filter -->
<div class="bg-white border-b border-[#e0e0e0] shrink-0">
<button onclick="toggleFilter()" class="flex items-center gap-1.5 px-6 py-2.5 text-[13px] text-gray-600 hover:text-gray-800 w-full text-left">
<svg id="filter-arrow" class="w-3 h-3 rotate-90 transition-transform" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L11.168 10 7.23 6.29a.75.75 0 1 1 1.04-1.08l4.5 4.25a.75.75 0 0 1 0 1.08l-4.5 4.25a.75.75 0 0 1-1.06-.02Z" clip-rule="evenodd"/></svg>
書類を絞り込み</button>
<div id="filter-panel" class="px-6 pb-3 flex items-end gap-6">
<div><label class="block text-[12px] text-gray-500 mb-1">書類分類</label>
<select id="filter-select" onchange="render()" class="border border-[#e0e0e0] rounded px-2.5 py-1.5 text-[13px] text-gray-700 bg-white min-w-[160px]">
<option>指定なし</option><option>配合計画書</option><option>フレッシュ試験</option><option>圧縮強度試験</option><option>納入伝票</option><option>打設計画書</option><option>受入写真</option><option>未分類</option>
</select></div>
<button onclick="document.getElementById('filter-select').value='指定なし';render()" class="text-[12px] text-gray-400 hover:text-gray-600 pb-1.5">条件をクリア</button>
</div></div>

<!-- Content -->
<div class="flex-1 overflow-auto p-6">
<input id="file-input" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="handleFiles(this.files);this.value=''" class="hidden"/>
<div id="content"></div>
</div></div></div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black-overlay z-50 flex items-center justify-center p-4" style="display:none">
<div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-85vh flex flex-col">
<div class="flex items-center justify-between px-5 py-3 border-b border-[#e0e0e0]">
<div><h2 class="text-[15px] font-bold text-gray-800">OCR抽出結果</h2><p id="modal-filename" class="text-[12px] text-gray-400 mt-0-5 truncate" style="max-width:28rem"></p></div>
<button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">&times;</button>
</div>
<div class="flex-1 overflow-auto p-5">
<div id="modal-header" class="flex items-center gap-3 mb-3"></div>
<div class="rounded border border-[#e0e0e0] overflow-hidden"><table class="w-full text-[13px]">
<thead><tr class="bg-[#fafafa] border-b border-[#e0e0e0]"><th class="text-left px-4 py-2 font-medium text-gray-500 w-[160px]">項目</th><th class="text-left px-4 py-2 font-medium text-gray-500">抽出値</th></tr></thead>
<tbody id="modal-fields"></tbody></table></div>
</div>
<div class="px-5 py-3 border-t border-[#e0e0e0] flex justify-between gap-2" style="justify-content:flex-end">
<button onclick="closeModal()" class="px-4 py-1.5 text-[13px] text-gray-600 border border-[#e0e0e0] rounded hover:bg-gray-50">閉じる</button>
<button class="px-4 py-1.5 text-[13px] text-white bg-brand rounded hover-bg-brand">データを確定</button>
</div></div></div>

<script>
var files = [];
var filterOpen = true;

function classify(name) {
  var l = name.toLowerCase();
  if (l.indexOf('配合') >= 0 || l.indexOf('haigo') >= 0) return '配合計画書';
  if (l.indexOf('フレッシュ') >= 0 || l.indexOf('fresh') >= 0) return 'フレッシュ試験';
  if (l.indexOf('圧縮') >= 0 || l.indexOf('強度') >= 0 || l.indexOf('strength') >= 0) return '圧縮強度試験';
  if (l.indexOf('納入') >= 0 || l.indexOf('伝票') >= 0 || l.indexOf('delivery') >= 0) return '納入伝票';
  if (l.indexOf('打設') >= 0 || l.indexOf('計画') >= 0 || l.indexOf('plan') >= 0) return '打設計画書';
  if (/\.(jpg|jpeg|png)$/i.test(l)) return '受入写真';
  return '未分類';
}

var catStyles = {
  '配合計画書': 'bg-blue-50 text-blue-700', 'フレッシュ試験': 'bg-green-50 text-green-700',
  '圧縮強度試験': 'bg-purple-50 text-purple-700', '納入伝票': 'bg-amber-50 text-amber-700',
  '打設計画書': 'bg-orange-50 text-orange-700', '受入写真': 'bg-pink-50 text-pink-700',
  '未分類': 'bg-gray-100 text-gray-500'
};

var mockData = {
  'フレッシュ試験': { type:'フレッシュコンクリート試験成績表', conf:0.95, fields:{ '試験日':'2024-06-15','工事名':'○○ビル新築工事','打設箇所':'2F スラブ','配合記号':'30-18-20N','工場名':'△△生コン','スランプ値':'18.0 cm','空気量':'4.5 %','コンクリート温度':'26.5 ℃','外気温':'28.0 ℃','塩化物含有量':'0.18 kg/m³','単位水量推定値':'168 kg/m³'}},
  '圧縮強度試験': { type:'コンクリート圧縮強度試験成績表', conf:0.92, fields:{ '試験日':'2024-07-13','工事名':'○○ビル新築工事','打設日':'2024-06-15','材齢':'28日','配合記号':'30-18-20N','設計基準強度Fc':'30 N/mm²','呼び強度':'33 N/mm²','供試体1':'35.2 N/mm²','供試体2':'34.8 N/mm²','供試体3':'36.1 N/mm²','平均強度':'35.4 N/mm²','判定':'合格 (35.4 ≧ 30)'}},
  '納入伝票': { type:'納入伝票', conf:0.88, fields:{ '伝票番号':'N-2024-0615-001','納入日':'2024-06-15','工場名':'△△生コン','配合記号':'30-18-20N','数量':'4.5 m³','出荷時刻':'08:30','到着時刻':'09:05','車両番号':'品川 100 あ 1234'}},
  '配合計画書': { type:'配合計画書', conf:0.90, fields:{ '工場名':'△△生コン','配合記号':'30-18-20N','呼び強度':'33 N/mm²','スランプ':'18 cm','粗骨材最大寸法':'20 mm','セメント種類':'普通ポルトランドセメント','水セメント比':'48.5 %','単位水量':'170 kg/m³','単位セメント量':'351 kg/m³'}},
  '受入写真': { type:'受入検査写真', conf:0.85, fields:{ '撮影日':'2024-06-15','工事名':'○○ビル新築工事','打設箇所':'2F スラブ','黒板記載_スランプ':'18.0 cm','黒板記載_空気量':'4.5 %','黒板記載_温度':'26.5 ℃'}},
  '打設計画書': { type:'打設計画書', conf:0.87, fields:{ '工事名':'○○ビル新築工事','打設日':'2024-06-15','打設箇所':'2F スラブ','配合記号':'30-18-20N','予定数量':'45.0 m³','ポンプ車':'36m級'}},
  '未分類': { type:'不明な書類', conf:0.60, fields:{ '工事名':'○○ビル新築工事','備考':'書類種別を自動判定できませんでした'}}
};

function formatSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(1) + ' MB';
}

function handleFiles(fileList) {
  var accepted = ['application/pdf','image/jpeg','image/png'];
  for (var i = 0; i < fileList.length; i++) {
    var f = fileList[i];
    if (accepted.indexOf(f.type) >= 0) {
      var id = Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2,8);
      files.push({ id:id, name:f.name, size:f.size, ocrStatus:'processing', ocrResult:null });
      startOcr(id, f.name);
    }
  }
  render();
}

function startOcr(id, name) {
  var delay = 800 + Math.random() * 1200;
  setTimeout(function() {
    var cat = classify(name);
    var mock = mockData[cat] || mockData['未分類'];
    for (var i = 0; i < files.length; i++) {
      if (files[i].id === id) {
        files[i].ocrStatus = 'done';
        files[i].ocrResult = mock;
        break;
      }
    }
    render();
  }, delay);
}

function removeFile(id) {
  files = files.filter(function(f) { return f.id !== id; });
  render();
}

function toggleFilter() {
  filterOpen = !filterOpen;
  document.getElementById('filter-panel').style.display = filterOpen ? '' : 'none';
  document.getElementById('filter-arrow').style.rotate = filterOpen ? '90deg' : '0deg';
}

function openModal(id) {
  var f = files.find(function(x){return x.id===id});
  if (!f || !f.ocrResult) return;
  document.getElementById('modal-filename').textContent = f.name;
  var hdr = '<span style="display:inline-block;background:#e8f0fe;color:#1a6fc9;font-size:13px;font-weight:500;padding:4px 12px;border-radius:4px">' + f.ocrResult.type + '</span>';
  hdr += '<span style="font-size:12px;color:#99a1af">信頼度: ' + Math.round(f.ocrResult.conf*100) + '%</span>';
  hdr += '<span style="font-size:11px;background:#fffbeb;color:#d97706;padding:2px 8px;border-radius:4px">デモモード</span>';
  document.getElementById('modal-header').innerHTML = hdr;
  var fields = f.ocrResult.fields;
  var keys = Object.keys(fields);
  var rows = '';
  for (var i = 0; i < keys.length; i++) {
    var border = i < keys.length - 1 ? ' border-b border-[#f0f0f0]' : '';
    rows += '<tr class="' + border + '"><td class="px-4 py-2 text-gray-500 font-medium">' + keys[i] + '</td><td class="px-4 py-2 text-gray-800">' + fields[keys[i]] + '</td></tr>';
  }
  document.getElementById('modal-fields').innerHTML = rows;
  document.getElementById('modal').style.display = '';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function render() {
  var filter = document.getElementById('filter-select').value;
  var filtered = filter === '指定なし' ? files : files.filter(function(f) { return classify(f.name) === filter; });
  var el = document.getElementById('content');
  document.getElementById('btn-lot').disabled = files.length === 0;

  if (files.length === 0) {
    el.innerHTML = '<div id="dropzone" class="rounded border-2 border-dashed border-[#d0d0d0] p-16 text-center cursor-pointer bg-white hover:border-[#aaa] transition-colors" onclick="document.getElementById(\'file-input\').click()">' +
      '<div class="flex flex-col items-center gap-3">' +
      '<svg class="w-10 h-10 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/></svg>' +
      '<p class="text-[14px] text-gray-600">ここに生コン関連書類をドラッグ＆ドロップ</p>' +
      '<p class="text-[12px] text-gray-400">または クリックしてファイルを選択（PDF / JPG / PNG）</p>' +
      '<p class="text-[11px] text-amber-500">アップロード後、自動でAI-OCRが実行されます</p>' +
      '<div class="flex flex-wrap justify-center gap-1.5 mt-2 text-[11px] text-gray-400">配合計画書 | 打設計画書 | フレッシュ試験 | 圧縮強度試験 | 納入伝票 | 受入写真</div>' +
      '</div></div>';
    setupDrop(document.getElementById('dropzone'));
    return;
  }

  var processing = files.some(function(f){return f.ocrStatus==='processing'});
  var html = '<div class="mb-3 flex items-center justify-between"><p class="text-[13px] text-gray-500">' +
    filtered.length + '件' + (filter !== '指定なし' ? ' (' + filter + ')' : '') + ' / 全' + files.length + '件' +
    (processing ? ' <span class="text-blue-500">OCR処理中...</span>' : '') +
    '</p><button onclick="files=[];render()" class="text-[12px] text-gray-400 hover:text-red-500">すべて削除</button></div>';

  html += '<div id="table-wrap" class="rounded border border-[#e0e0e0] bg-white overflow-hidden"><table class="w-full text-[13px]"><thead><tr class="bg-[#fafafa] border-b border-[#e0e0e0]">' +
    '<th class="text-left px-4 py-2.5 font-medium text-gray-500 w-8"><input type="checkbox"/></th>' +
    '<th class="text-left px-4 py-2.5 font-medium text-gray-500">ファイル名</th>' +
    '<th class="text-left px-4 py-2.5 font-medium text-gray-500 w-[120px]">分類</th>' +
    '<th class="text-left px-4 py-2.5 font-medium text-gray-500 w-[160px]">OCRステータス</th>' +
    '<th class="text-right px-4 py-2.5 font-medium text-gray-500 w-[90px]">サイズ</th>' +
    '<th class="text-center px-4 py-2.5 font-medium text-gray-500 w-10"></th></tr></thead><tbody>';

  for (var i = 0; i < filtered.length; i++) {
    var f = filtered[i];
    var cat = classify(f.name);
    var cs = catStyles[cat] || catStyles['未分類'];
    var status = '';
    if (f.ocrStatus === 'processing') {
      status = '<span class="inline-flex items-center gap-1 text-[12px] text-blue-500"><svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>OCR処理中...</span>';
    } else if (f.ocrStatus === 'done') {
      status = '<a href="#" onclick="openModal(\'' + f.id + '\');return false" class="inline-flex items-center gap-1 text-[12px] text-green-600 hover-underline" style="cursor:pointer"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd"/></svg>抽出完了 →結果を見る</a>';
    }
    html += '<tr class="border-b border-[#f0f0f0] hover:bg-[#fafafa] transition-colors">' +
      '<td class="px-4 py-2.5"><input type="checkbox"/></td>' +
      '<td class="px-4 py-2.5 text-gray-800"><span class="truncate block max-w-md">' + f.name + '</span></td>' +
      '<td class="px-4 py-2.5"><span class="inline-block rounded px-2 py-0.5 text-[12px] font-medium ' + cs + '">' + cat + '</span></td>' +
      '<td class="px-4 py-2.5">' + status + '</td>' +
      '<td class="px-4 py-2.5 text-right text-gray-500">' + formatSize(f.size) + '</td>' +
      '<td class="px-4 py-2.5 text-center"><button onclick="removeFile(\'' + f.id + '\')" class="text-gray-300 hover:text-red-500 transition-colors" style="cursor:pointer">&times;</button></td></tr>';
  }
  html += '</tbody></table></div>';
  html += '<div onclick="document.getElementById(\'file-input\').click()" class="mt-3 rounded border border-dashed border-[#d0d0d0] p-3 text-center text-[12px] text-gray-400 cursor-pointer hover:border-gray-400 hover:text-gray-500 transition-colors">+ さらにファイルを追加</div>';
  el.innerHTML = html;
  setupDrop(document.getElementById('table-wrap'));
}

function setupDrop(el) {
  if (!el) return;
  el.addEventListener('dragover', function(e) { e.preventDefault(); el.style.borderColor = '#1a6fc9'; });
  el.addEventListener('dragleave', function(e) { e.preventDefault(); el.style.borderColor = ''; });
  el.addEventListener('drop', function(e) { e.preventDefault(); el.style.borderColor = ''; if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}

// Init
render();
</script>
</body>
</html>
